<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahoy Barbershop</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="navbar">
        <a href="home.html">Home</a>
        <a href="our-haircuts.html">Our Haircuts</a> 
        <a href="about-us.html">About Us</a>
        <a href="contact-us.html">Contact Us</a>
        <a id="membership" href="membership.html">Membership</a>
    </div>

    <div class="logback-4">
        <img id="background" src="assets/images/background.jpeg" alt="background"> 
        <div id="text-overlay-5">
            <div class="form-container">
                    <form action="" method="post">
                        <h2>Membership Form</h2>
                        <div class="form">
                            <label for="fullName">Full Name</label>
                            <br>
                            <input type="text" id="fullName" name="fullName">
                            <br>
                        </div>

                        <div class="form">
                            <label for="email">Email</label>
                            <br>
                            <input type="email" id="email" name="email">
                            <br>
                        </div>

                        <div class="form">    
                            <label for="address">Home Address</label>
                            <br>
                            <input type="text" id="address" name="address">
                            <br>
                        </div>

                        <div class="form-2">
                            <p>Membership Duration</p>
                            <div class="membership">
                                <label><input type="radio" name="duration" id="threeMonths"> 3 Months</label><br>
                                <label><input type="radio" name="duration" id="sixMonths"> 6 Months</label><br>
                                <label><input type="radio" name="duration" id="twelveMonths"> 12 Months</label>
                            </div>
                        </div>
            
                        <div class="form-2">
                            <div class="agree">
                                <label><input type="checkbox" name="agree" id="agree">Agree to terms and conditions</label>
                            </div>
                        </div>
                        
                        <br>
                        <button type="button" id="signUp" onclick="validateSignUp()">Sign Up</button>
                    </form>
            </div>
        </div>  
    </div>

    
    <footer>
        &copy; Copyright Ahoy Barbershop 2024
    </footer>

</body>
    <script src="assets/index.js"></script>
</html>
